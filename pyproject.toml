[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wiki-cli"
version = "0.1.0"
description = "Personal wiki CLI with local Gemma (Ollama) and RAG"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.scripts]
wiki = "wiki_cli.cli:main"

[tool.setuptools]
packages = ["wiki_cli"]
